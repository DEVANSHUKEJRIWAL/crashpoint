name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Tool module — vet and race tests
        run: |
          go vet ./...
          go test -race ./...   # includes the kfake end-to-end proxy test (#6/#7)

      - name: SUT module — vet and tests
        working-directory: sut
        run: |
          go vet ./...
          go test ./...   # DB integration test skips without CRASHPOINT_TEST_DSN

      - name: Short fuzz run for every parser
        run: |
          go test -run='^$' -fuzz=FuzzReadFrame          -fuzztime=20s ./internal/proxy/
          go test -run='^$' -fuzz=FuzzParseRequestHeader -fuzztime=20s ./internal/protocol/
          go test -run='^$' -fuzz=FuzzSkipTags           -fuzztime=20s ./internal/protocol/
